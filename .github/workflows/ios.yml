name: Build HBOLT IPA

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "Bundle ID (reuse an existing sideloaded app's App ID)"
        required: false
        default: ""

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci || npm install

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Build app (no signing — SideStore signs it on the phone)
        env:
          BID: ${{ github.event.inputs.bundle_id }}
        run: |
          xcodebuild -version
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            ${BID:+PRODUCT_BUNDLE_IDENTIFIER=$BID} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 60
          test -d build/Build/Products/Release-iphoneos/App.app

      - name: Verify bundle (plugins + Keychain + no leftover secrets code path)
        run: |
          APP=build/Build/Products/Release-iphoneos/App.app
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist"
          (strings "$APP/App"; find "$APP/Frameworks" -type f -exec strings {} +) | grep -q "SecureStorage" && echo "SecureStorage plugin linked" || { echo "::error::SecureStorage plugin not found in binary"; exit 1; }
          grep -lq "tgp_" "$APP"/public/assets/*.js && echo "Keychain prefix present in JS" || { echo "::error::secureStore missing"; exit 1; }
          codesign -dv "$APP" 2>&1 | head -3 || true

      - name: Package IPA (unsigned)
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          VER=$(node -p "require('./package.json').version")
          zip -qry "HBOLT-$VER-unsigned.ipa" Payload
          echo "VER=$VER" >> $GITHUB_ENV

      # Signs with YOUR certificate if these repo secrets exist:
      #   SIGN_P12_BASE64, SIGN_P12_PASSWORD, SIGN_PROFILE_BASE64
      # (Settings → Secrets and variables → Actions). Nothing is committed.
      - name: Sign IPA with provided certificate
        env:
          P12: ${{ secrets.SIGN_P12_BASE64 }}
          P12PW: ${{ secrets.SIGN_P12_PASSWORD }}
          PROF: ${{ secrets.SIGN_PROFILE_BASE64 }}
        run: |
          if [ -z "$P12" ] || [ -z "$PROF" ]; then echo "::warning::No signing secrets — only the unsigned IPA is produced"; exit 0; fi
          KC="$RUNNER_TEMP/sign.keychain-db"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p ci "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/c.p12"
          security import "$RUNNER_TEMP/c.p12" -P "$P12PW" -A -t cert -f pkcs12 -k "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          IDENT=$(security find-identity -v -p codesigning "$KC" | awk 'NR==1{print $2}')
          test -n "$IDENT" || { echo "::error::certificate not imported"; exit 1; }
          echo "$PROF" | base64 --decode > "$RUNNER_TEMP/p.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/p.mobileprovision" > "$RUNNER_TEMP/p.plist"
          APPID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$RUNNER_TEMP/p.plist")
          TEAM=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$RUNNER_TEMP/p.plist")
          BID="${APPID#${TEAM}.}"
          echo "Signing as $BID (team $TEAM)"
          APP=Payload/App.app
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BID" "$APP/Info.plist"
          cp "$RUNNER_TEMP/p.mobileprovision" "$APP/embedded.mobileprovision"
          cat > "$RUNNER_TEMP/ent.plist" <<PL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>application-identifier</key><string>$APPID</string>
          <key>com.apple.developer.team-identifier</key><string>$TEAM</string>
          <key>keychain-access-groups</key><array><string>$APPID</string></array>
          <key>get-task-allow</key><false/>
          </dict></plist>
          PL
          sed -i '' 's/^          //' "$RUNNER_TEMP/ent.plist"
          for f in "$APP"/Frameworks/*.framework; do codesign -f -s "$IDENT" --keychain "$KC" "$f"; done
          codesign -f -s "$IDENT" --keychain "$KC" --entitlements "$RUNNER_TEMP/ent.plist" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -d --entitlements :- "$APP" | head -20
          zip -qry "HBOLT-$VER.ipa" Payload
          security delete-keychain "$KC"; rm -f "$RUNNER_TEMP/c.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: HBOLT-ipa
          path: "HBOLT-*.ipa"
          retention-days: 30
