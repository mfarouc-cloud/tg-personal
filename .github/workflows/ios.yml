name: Build iOS IPA (unsigned, for SideStore)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "Bundle ID (reuse an existing sideloaded app's App ID)"
        required: false
        default: ""

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci || npm install

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Build app (no signing — SideStore signs it on the phone)
        env:
          BID: ${{ github.event.inputs.bundle_id }}
        run: |
          xcodebuild -version
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            ${BID:+PRODUCT_BUNDLE_IDENTIFIER=$BID} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 60
          test -d build/Build/Products/Release-iphoneos/App.app

      - name: Verify bundle (plugins + Keychain + no leftover secrets code path)
        run: |
          APP=build/Build/Products/Release-iphoneos/App.app
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist"
          (strings "$APP/App"; find "$APP/Frameworks" -type f -exec strings {} +) | grep -q "SecureStorage" && echo "SecureStorage plugin linked" || { echo "::error::SecureStorage plugin not found in binary"; exit 1; }
          grep -lq "tgp_" "$APP"/public/assets/*.js && echo "Keychain prefix present in JS" || { echo "::error::secureStore missing"; exit 1; }
          codesign -dv "$APP" 2>&1 | head -3 || true

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          VER=$(node -p "require('./package.json').version")
          zip -qry "tg-personal-$VER.ipa" Payload
          ls -la *.ipa
          echo "VER=$VER" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: tg-personal-ipa
          path: "*.ipa"
          retention-days: 30
