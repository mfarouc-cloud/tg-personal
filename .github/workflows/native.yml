name: Build HBOLT Native IPA

# Native Swift build: official Telegram-iOS source + HBOLT changes from native/.
on:
  push:
    branches: [main]
    paths: ["native/**", ".github/workflows/native.yml"]
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Pick newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v beta | sort -V | tail -1); X=${X:-$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)}
          sudo xcode-select -s "$X"
          xcodebuild -version
          df -h /

      - name: Free disk space
        run: |
          sudo rm -rf /Users/runner/Library/Android /usr/local/share/dotnet /opt/hostedtoolcache/CodeQL || true
          ls -d /Applications/Xcode_*.app | sort -V | head -n -1 | xargs -r sudo rm -rf || true
          df -h /

      - name: Fetch Telegram-iOS source
        run: |
          REF=$(grep -v '^#' native/upstream.txt | head -1)
          git init tgios && cd tgios
          git remote add origin https://github.com/TelegramMessenger/Telegram-iOS.git
          git fetch --depth 1 origin "$REF" || git fetch --depth 50 origin master
          git checkout FETCH_HEAD 2>/dev/null || git checkout "$REF"
          git submodule update --init --recursive --depth 1 --jobs 8

      - name: Apply HBOLT changes
        run: native/apply-hbolt.sh tgios

      - name: Fresh codesigning profiles (upstream fake ones expired 2026-10-30)
        run: python3 native/make-profiles.py tgios/build-system/fake-codesigning com.hbolt.app

      - name: Import build-time signing identity (Telegram fake-codesigning cert)
        run: |
          FC=tgios/build-system/fake-codesigning
          KC="$RUNNER_TEMP/hbolt.keychain-db"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p ci "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KC"
          security import "$FC/certs/SelfSigned.p12" -k "$KC" -P "" -A -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KC" >/dev/null
          sudo security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain "$FC/certs/Public.cer" || true
          security find-identity -p codesigning "$KC"
          security find-identity -v -p codesigning "$KC"

      - name: Configuration
        env:
          API_ID: ${{ secrets.TG_API_ID }}
          API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          if [ -z "$API_ID" ] || [ -z "$API_HASH" ]; then
            echo "::warning::TG_API_ID / TG_API_HASH secrets missing — compile-test build only (login will not work)"
            API_ID=0; API_HASH=00000000000000000000000000000000
          fi
          mkdir -p cfg
          cat > cfg/configuration.json <<JSON
          {
            "bundle_id": "com.hbolt.app",
            "api_id": "$API_ID",
            "api_hash": "$API_HASH",
            "team_id": "C67CF9S4VU",
            "app_center_id": "0",
            "is_internal_build": "false",
            "is_appstore_build": "false",
            "appstore_id": "0",
            "app_specific_url_scheme": "tg",
            "premium_iap_product_id": "",
            "enable_siri": false,
            "enable_icloud": false
          }
          JSON

      - name: Bazel cache
        uses: actions/cache@v4
        with:
          path: ~/telegram-bazel-cache
          key: tgbazel-${{ hashFiles('native/upstream.txt') }}-${{ hashFiles('native/patches/**') }}
          restore-keys: |
            tgbazel-${{ hashFiles('native/upstream.txt') }}-

      - name: Build (Bazel, release_arm64, fake codesigning — re-sign on device)
        working-directory: tgios
        shell: bash
        run: |
          python3 build-system/Make/Make.py \
            --overrideXcodeVersion --overrideBazelVersion \
            --cacheDir="$HOME/telegram-bazel-cache" \
            build \
            --configurationPath="$GITHUB_WORKSPACE/cfg/configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --buildNumber=${{ github.run_number }} \
            --configuration=release_arm64 2>&1 | tail -n 400
          find -L bazel-bin/Telegram -maxdepth 1 -name "*.ipa"

      - name: Package HBOLT-Native-Ultimate-Complete.ipa (extensions stripped)
        run: |
          IPA=$(find -L tgios/bazel-bin/Telegram -maxdepth 1 -name "*.ipa" | head -1); echo "IPA=$IPA"
          test -n "$IPA"
          rm -rf pkg && mkdir pkg && cd pkg && unzip -q "$GITHUB_WORKSPACE/$IPA"
          APP=$(ls -d Payload/*.app)
          # No app extensions / watch app: they need entitlements a sideload cert can't give.
          rm -rf "$APP/PlugIns" "$APP/Watch" "$APP/_CodeSignature" "$APP/embedded.mobileprovision"
          rm -rf SwiftSupport WatchKitSupport* Symbols
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" -c "Print :CFBundleDisplayName" "$APP/Info.plist"
          EXE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist")
          otool -l "$APP/$EXE" | grep -A4 LC_ENCRYPTION_INFO | grep cryptid || echo "no LC_ENCRYPTION_INFO (cryptid 0)"
          zip -qry ../HBOLT-Native-Ultimate-Complete.ipa Payload
          cd .. && ls -la HBOLT-Native-Ultimate-Complete.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: HBOLT-Native-ipa
          path: HBOLT-Native-Ultimate-Complete.ipa
          retention-days: 30
